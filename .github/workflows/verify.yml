name: Verify UGI (unit + real FalkorDB)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugi-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UGI_PROVIDER: offline
      UGI_ALLOW_PAID_CALLS: 'false'
      UGI_TEST_REDIS_URL: redis://127.0.0.1:6380/0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and tests
        run: python -m pip install -e '.[test]'
      - name: Check Python syntax
        run: python -m compileall -q ugi tests
      - name: Check dashboard JavaScript syntax
        run: node --check ugi/assets/app.js
      - name: Run unit, API, provider and MCP tests
        run: python -m pytest -q -m 'not integration'
      - name: Start isolated FalkorDB
        run: docker compose up -d --wait graph
      - name: Run real graph integration and HTTP tests
        run: python -m pytest -q -m integration
      - name: Verify packaged Docker dashboard and API
        run: |
          docker compose up -d --build --wait api
          curl --fail http://127.0.0.1:8001/ready
          curl --fail http://127.0.0.1:8001/assets/app.js --output /tmp/ugi-app.js
          node --check /tmp/ugi-app.js
      - name: Verify synthetic benchmark executes
        run: python -m ugi.evaluate --output /tmp/ugi-ci-evaluation.json
      - name: Audit unseen-style challenge (offline, synthetic)
        run: python -m ugi.eval_challenge --output /tmp/ugi-challenge-evaluation.json
      - name: Verify frozen relation and n-ary evaluation (provisional labels)
        run: python -m ugi.eval_intelligence --fixture evaluation/intelligence_eval.json --development evaluation/intelligence_dev.json --output /tmp/ugi-intelligence-evaluation.json
      - name: Verify three-domain persistent FalkorDB action workflow
        run: python -m ugi.demo --execute --dataset-prefix ci-showcase --output /tmp/ugi-showcase.json
      - name: Verify provisional identity reversal and targeted stale detection
        run: python -m ugi.demo_identity --execute --dataset ci-identity --output /tmp/ugi-identity.json
      - name: Verify source-grounded identity policy cases on actual FalkorDB
        run: python -m ugi.eval_identity --output /tmp/ugi-f-identity.json
      - name: Measure bounded opt-in ledger overhead with exact graph checks
        run: python -m ugi.benchmark_identity --output /tmp/ugi-identity-overhead.json
      - name: Verify source-aware conversion and persisted graph incidence
        run: python -m ugi.conversion_audit --fixture evaluation/c_development.json --output /tmp/ugi-c-development.json
      - name: Verify frozen public checkpoint (unreviewed, no accuracy claim)
        run: python -m ugi.conversion_audit --fixture evaluation/c_evaluation.json --development evaluation/c_development.json --final-checkpoint --output /tmp/ugi-c-evaluation.json
      - name: Independently recheck recorded provisional metric arithmetic
        run: |
          python evaluation/recheck_c_metrics.py
          python evaluation/recheck_d_metrics.py
      - name: Verify 100/1000/2000-record real CSV and JSON ingestion
        run: |
          python -m ugi.benchmark_conversion --sizes 100 1000 2000 --output /tmp/ugi-c-capacity.json
          python -c "import json; r=json.load(open('/tmp/ugi-c-capacity.json')); assert all(x['success'] for x in r['results'])"
      - name: External human-annotated FewRel directed-pair diagnostic (not F1)
        run: python -m ugi.eval_fewrel --download --limit 128 --seed 17 --output /tmp/ugi-fewrel-evaluation.json
      - name: Upload evaluation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ugi-evaluation-diagnostics
          path: |
            /tmp/ugi-ci-evaluation.json
            /tmp/ugi-challenge-evaluation.json
            /tmp/ugi-fewrel-evaluation.json
            /tmp/ugi-intelligence-evaluation.json
            /tmp/ugi-showcase.json
            /tmp/ugi-c-development.json
            /tmp/ugi-c-evaluation.json
            /tmp/ugi-c-capacity.json
            /tmp/ugi-identity.json
            /tmp/ugi-identity-overhead.json
            /tmp/ugi-f-identity.json
          retention-days: 14
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100 graph || true
      - name: Shut down isolated graph
        if: always()
        run: docker compose down
