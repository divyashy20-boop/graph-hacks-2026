name: ugi-event
services:
  graph:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    environment:
      REDIS_ARGS: --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction
      FALKORDB_ARGS: THREAD_COUNT 2 TIMEOUT_MAX 5000
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3001:3000"
    volumes:
      - event-graph:/data
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      UGI_BACKEND: falkordb
      UGI_REDIS_URL: redis://graph:6379/0
      UGI_PROVIDER: ${UGI_PROVIDER:-offline}
      UGI_ALLOW_PAID_CALLS: "${UGI_ALLOW_PAID_CALLS:-false}"
      UGI_SCHEMA_WRITES: "${UGI_SCHEMA_WRITES:-false}"
      UGI_OPEN_PREDICATES: "${UGI_OPEN_PREDICATES:-false}"
      UGI_IDENTITY_LEDGER: ${UGI_IDENTITY_LEDGER:-false}
      UGI_IDENTITY_RESOLUTION: "${UGI_IDENTITY_RESOLUTION:-off}"
      UGI_IDENTITY_AUTO_APPLY: "${UGI_IDENTITY_AUTO_APPLY:-false}"
      UGI_IDENTITY_AUTHORITIES: '${UGI_IDENTITY_AUTHORITIES:-{}}'
      UGI_MODEL_ID: ${UGI_MODEL_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      UGI_GROQ_REQUESTS_PER_MINUTE: ${UGI_GROQ_REQUESTS_PER_MINUTE:-30}
      UGI_GROQ_DAILY_REQUESTS: ${UGI_GROQ_DAILY_REQUESTS:-1000}
      UGI_GROQ_TOKENS_PER_MINUTE: ${UGI_GROQ_TOKENS_PER_MINUTE:-8000}
      UGI_GROQ_DAILY_TOKENS: ${UGI_GROQ_DAILY_TOKENS:-200000}
      UGI_GROQ_TIMEOUT_SECONDS: ${UGI_GROQ_TIMEOUT_SECONDS:-90}
      UGI_GROQ_SPLIT_MAX_OUTPUT_TOKENS: ${UGI_GROQ_SPLIT_MAX_OUTPUT_TOKENS:-1550}
      UGI_INPUT_PRICE: ${UGI_INPUT_PRICE:-0}
      UGI_OUTPUT_PRICE: ${UGI_OUTPUT_PRICE:-0}
      UGI_MAX_MODEL_CALLS: ${UGI_MAX_MODEL_CALLS:-4}
      UGI_MAX_OUTPUT_TOKENS: ${UGI_MAX_OUTPUT_TOKENS:-1500}
      UGI_MAX_INPUT_TOKENS: ${UGI_MAX_INPUT_TOKENS:-12000}
      UGI_OLLAMA_URL: ${UGI_OLLAMA_URL:-http://host.docker.internal:11434}
      UGI_EXTRACTION_WINDOWS: ${UGI_EXTRACTION_WINDOWS:-1}
      UGI_API_KEYS: ${UGI_API_KEYS:-}
      UGI_GUIDED_AGENT_ENABLED: ${UGI_GUIDED_AGENT_ENABLED:-false}
      UGI_MEMORY_ENABLED: ${UGI_MEMORY_ENABLED:-false}
      UGI_MEMORY_PATH: /var/lib/ugi/receipts.sqlite3
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - event-receipts:/var/lib/ugi
    depends_on:
      graph:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
volumes:
  event-graph:
  event-receipts:
