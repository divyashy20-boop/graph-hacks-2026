[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-graph-intelligence"
version = "1.0.0"
description = "Evidence-grounded graph investigations and persistent actions"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.8", "pydantic-settings>=2.4", "python-multipart>=0.0.9", "redis>=5,<8", "uvicorn>=0.30", "boto3>=1.34", "pypdf>=5"]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["ugi"]

[tool.pytest.ini_options]
pythonpath = [".", "../src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires real FalkorDB"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
